name: "Zerho Technical Documentation & llms.txt Sync"

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/generate_docs.ts"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  zerho-docs-sync:
    name: "📚 Zerho API Reference & llms.txt Sync"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate Zerho API Reference & llms.txt
        run: deno task docs

      - name: Open or Update Documentation Sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reference.md llms.txt llms-full.txt
          if git diff --staged --quiet; then
            echo "Zerho documentation and llms.txt are already up to date."
          else
            BRANCH="docs/zerho-sync"
            git checkout -B "$BRANCH"
            git commit -m "docs(zerho): synchronize API reference and llms.txt [skip ci]"
            git push --force-with-lease origin "$BRANCH"
            if ! gh pr view "$BRANCH" >/dev/null 2>&1; then
              gh pr create \
                --base main \
                --head "$BRANCH" \
                --title "docs(zerho): synchronize API reference and llms.txt" \
                --body "Automated documentation and \`llms.txt\` synchronization triggered by Zerho Docs Sync."
            fi
          fi
